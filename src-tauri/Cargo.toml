[package]
name = "whip_clothing_tool"
version = "0.2.1"
description = "Whip Clothing Tool - export GTA V clothing previews and prop models for FiveM (WHIP)"
authors = ["you"]
edition = "2021"

[lib]
name = "whip_clothing_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
